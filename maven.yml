name: Java CI with Maven

# This workflow automatically builds the project and runs the JUnit
# tests every time code is pushed or a pull request is opened, so the
# code is tested with every change (PoE requirement).

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests with Maven
        run: mvn -B test
